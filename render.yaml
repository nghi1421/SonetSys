databases:
  - name: sonetsys-db
    plan: free
    databaseName: sonetsys
    user: sonetsys

services:
  - type: web
    name: backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: sonetsys-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public

  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build-only
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
